name: Android

on:
  push:
    branches: [main, feat/trusted-transports]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_OFFLINE: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install locked packages
        run: npm ci
      - name: Verify TypeScript source, lint, and behavior
        run: npm run check
      - name: Bundle Android JavaScript
        run: npm run bundle:android
      - name: Generate platform project from package plugins
        run: npm run prebuild:android
      - name: Install Android build requirements
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Build optimized preview APK (CI debug key; not for production)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Verify APK identity, signing, and permission boundary
        shell: bash
        env:
          ALLOW_DEBUG_PREVIEW_SIGNER: '1'
          APP_ENV: preview
        run: |
          preview_apk=android/app/build/outputs/apk/release/app-release.apk
          evidence=android/app/build/outputs/apk/release
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump permissions "$preview_apk" > "$evidence/permissions.txt"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$preview_apk" > "$evidence/badging.txt"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$preview_apk" > "$evidence/certificate.txt"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$preview_apk" > "$evidence/manifest.xml"
          node scripts/audit-manifest.mts "$evidence/permissions.txt" "$evidence/badging.txt" "$evidence/certificate.txt" "$evidence/manifest.xml"
          (cd "$evidence" && sha256sum app-release.apk > SHA256SUMS)
          echo 'CI preview only: optimized APK signed using the generated Android debug keystore. Production uses the EAS production profile and remote credentials.' > "$evidence/SIGNING-NOTICE.txt"
      - name: Upload APK audit metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-apk-metadata
          path: |
            android/app/build/outputs/apk/release/permissions.txt
            android/app/build/outputs/apk/release/badging.txt
            android/app/build/outputs/apk/release/certificate.txt
            android/app/build/outputs/apk/release/manifest.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: synced-android-preview-debug-signed
          path: android/app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 14
  launch-smoke-test:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: synced-android-preview-debug-signed
          path: preview
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test two Android 15 phones on shared Wi-Fi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash scripts/smoke-android.sh
            node scripts/dual-emulator-start.mts
            node scripts/dual-android.mts preview/app-release.apk --voice --screen-control --evidence=smoke-evidence/dual
      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-launch-evidence
          path: smoke-evidence/
          if-no-files-found: warn
          retention-days: 14
