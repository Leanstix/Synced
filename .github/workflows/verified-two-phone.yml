name: Verified two-phone qualification

on:
  push:
    branches: [test/sandbox-iteration]

permissions:
  contents: read
  actions: read

jobs:
  qualify-audited-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flow: [voice, screen]
    env:
      APK_SOURCE_SHA: fed4703eb8c3b7e5d9622dc0daafc0f256f6ebe4
      REUSE_APK_EXACT: '0'
      CI: '1'
      EXPO_OFFLINE: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify reused APK source identity
        run: |
          if [ "$REUSE_APK_EXACT" = 1 ]; then
            node scripts/assert-preview-source.mts "$APK_SOURCE_SHA"
          else
            node scripts/assert-preview-source.mts "$APK_SOURCE_SHA" --javascript-only
          fi
      - run: npm ci
      - run: npm run check
      - uses: actions/download-artifact@v4
        with:
          name: synced-android-preview-debug-signed
          run-id: 40968725019
          github-token: ${{ github.token }}
          path: preview
      - name: Verify reused artifact checksum and permission evidence
        env:
          APP_ENV: preview
          ALLOW_DEBUG_PREVIEW_SIGNER: '1'
        run: |
          (cd preview && sha256sum --check SHA256SUMS)
          node scripts/audit-manifest.mts preview/permissions.txt preview/badging.txt preview/certificate.txt preview/manifest.xml
      - name: Build an aligned JS iteration APK from the audited native envelope
        if: env.REUSE_APK_EXACT != '1'
        env:
          SYNCED_DEBUG_STORE_PASS: android
        run: |
          npm run bundle:android -- --max-workers 2
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0"
          node scripts/prepare-iteration-apk.mts preview/app-release.apk dist/metadata.json preview/iteration-unsigned.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -P 16 -f 4 preview/iteration-unsigned.apk preview/iteration-aligned.apk
          tar -xOf node_modules/expo/template.tgz package/android/app/debug.keystore > "$RUNNER_TEMP/synced-iteration-debug.keystore"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$RUNNER_TEMP/synced-iteration-debug.keystore" --ks-key-alias androiddebugkey --ks-pass env:SYNCED_DEBUG_STORE_PASS --key-pass env:SYNCED_DEBUG_STORE_PASS --out preview/app-release.apk preview/iteration-aligned.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs preview/app-release.apk > preview/certificate.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump permissions preview/app-release.apk > preview/permissions.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging preview/app-release.apk > preview/badging.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print preview/app-release.apk > preview/manifest.xml
          APP_ENV=preview ALLOW_DEBUG_PREVIEW_SIGNER=1 node scripts/audit-manifest.mts preview/permissions.txt preview/badging.txt preview/certificate.txt preview/manifest.xml
          (cd preview && sha256sum app-release.apk > SHA256SUMS)
      - name: Record exact source qualification
        run: |
          mkdir -p smoke-evidence
          printf 'APK source: %s\nHarness source: %s\nArtifact run: 40968725019\nExact binary reuse: %s\n' "$APK_SOURCE_SHA" "$GITHUB_SHA" "$REUSE_APK_EXACT" > smoke-evidence/qualified-source.txt
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test two Android 15 phones against qualified source
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash scripts/smoke-android.sh
            node scripts/dual-emulator-start.mts
            node scripts/dual-android.mts preview/app-release.apk ${{ matrix.flow == 'voice' && '--voice' || '--voice --screen-control' }} --evidence=smoke-evidence/dual
      - name: Upload two-phone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.flow }}-evidence
          path: smoke-evidence/
          if-no-files-found: warn
          retention-days: 14
